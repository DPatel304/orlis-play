<!doctype html>
<html><head><meta charset="utf-8"><title>House style, painted - mockups</title>
<style>
  body{ margin:0; background:#e9ebf2; }
  .frame{ width:1600px; height:900px; position:relative; overflow:hidden; margin:0 0 24px; }
  .frame canvas{ position:absolute; inset:0; }
</style></head>
<body>
<div class="frame" id="run"><canvas width="1600" height="900"></canvas></div>
<div class="frame" id="crash"><canvas width="1600" height="900"></canvas></div>
<div class="frame" id="pop"><canvas width="1600" height="900"></canvas></div>
<script type="module">
/* The house style (B) with an open-world painter's touch:
   - a painted sky wash, and distance: each far layer fades into the sky
   - two-tone cel shading on everything (lit side, one shadow tone), one
     warm sun from the upper left, shadows falling right
   - wind: grass leaning, petals and leaves drifting, smoke bending
   - the kids still the only things in full colour, now cel-shaded with a
     soft rim of light
   - a faint paper grain over the whole picture */
import { body, setStyle, PARTS } from '/src/ui/avatar-art.js';

const W = 1600, H = 900, T = 1.3, PI = Math.PI;
const KIDS = [
  { skin: PARTS.skin[1], hair: 'ponytail', hairColor: PARTS.hairColor[1], eyes: 'sparkle', mouth: 'grin', color: '#ff5d8f', outfit: 'stars', extra: 'bow' },
  { skin: PARTS.skin[3], hair: 'curly', hairColor: PARTS.hairColor[0], eyes: 'dots', mouth: 'smile', color: '#3da9ff', outfit: 'stripes', extra: 'cap' },
  { skin: PARTS.skin[5], hair: 'spiky', hairColor: PARTS.hairColor[0], eyes: 'wink', mouth: 'grin', color: '#a855f7', outfit: 'hoodie', extra: 'headphones' }
];
const SKY_TOP = '#9ec9e0', SKY_LOW = '#f3ead6', INK = '#33322e';
const ctx = (id) => document.querySelector(`#${id} canvas`).getContext('2d');
let seed = 9; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
function mix(a, b, k){ const p = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); const x = p(a), y = p(b); return '#' + x.map((v, i) => Math.round(v + (y[i] - v) * k).toString(16).padStart(2, '0')).join(''); }
const circle = (c, x, y, r) => { c.beginPath(); c.arc(x, y, r, 0, PI * 2); };
const oval = (c, x, y, rx, ry, rot = 0) => { c.beginPath(); c.ellipse(x, y, rx, ry, rot, 0, PI * 2); };
const poly = (c, pts) => { c.beginPath(); pts.forEach(([x, y], i) => i ? c.lineTo(x, y) : c.moveTo(x, y)); c.closePath(); };
const fill = (c, col) => { c.fillStyle = col; c.fill(); };
const layer = () => { const o = document.createElement('canvas'); o.width = W; o.height = H; return o; };

/* ---- the painted sky ---- */
function sky(c, horizon){
  const g = c.createLinearGradient(0, 0, 0, horizon); g.addColorStop(0, SKY_TOP); g.addColorStop(1, SKY_LOW);
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const sun = c.createRadialGradient(260, 120, 10, 260, 120, 620); sun.addColorStop(0, 'rgba(255,244,214,.85)'); sun.addColorStop(1, 'rgba(255,244,214,0)'); c.fillStyle = sun; c.fillRect(0, 0, W, H);
  /* soft painted clouds: long, wind-stretched */
  c.save(); c.filter = 'blur(10px)';
  for (const [x, y, w, h] of [[520, 120, 300, 34], [700, 150, 220, 24], [1180, 90, 360, 40], [1360, 130, 200, 22], [200, 230, 240, 22]]){ oval(c, x, y, w, h); fill(c, 'rgba(255,255,255,.75)'); oval(c, x + 30, y + h * .6, w * .8, h * .5); fill(c, 'rgba(214,222,232,.5)'); }
  c.restore();
}
/* a range of hills at a distance d (0 near .. 1 far): faded into the sky,
   lit on the left slopes, one shadow tone on the right */
function range(c, y, amp, col, d, step = 260, phase = 0){
  const base = mix(col, SKY_LOW, d * .78), shade = mix(base, '#5a6a7a', .14);
  const pts = []; for (let x = -step; x <= W + step; x += step / 2) pts.push([x, y - amp * (.5 + .5 * Math.sin(x / step * 2.1 + phase)) - (R() * amp * .25)]);
  c.beginPath(); c.moveTo(-step, H); pts.forEach(([x, py]) => c.lineTo(x, py)); c.lineTo(W + step, H); c.closePath(); fill(c, base);
  /* the shadow side of each hump */
  for (let i = 1; i < pts.length - 1; i++) if (pts[i][1] < pts[i - 1][1] && pts[i][1] < pts[i + 1][1]){
    poly(c, [pts[i], pts[i + 1], [pts[i + 1][0] + step * .3, y + 40], [pts[i][0] + step * .15, y + 40]]); fill(c, shade);
  }
}
/* the ground: lighter toward the horizon, wind-leaning brush grass */
function ground(c, y0, col){
  const g = c.createLinearGradient(0, y0, 0, H); g.addColorStop(0, mix(col, SKY_LOW, .35)); g.addColorStop(1, col);
  c.fillStyle = g; c.fillRect(0, y0, W, H - y0);
  for (let i = 0; i < 900; i++){
    const y = y0 + Math.pow(R(), .7) * (H - y0), x = R() * W, s = .4 + (y - y0) / (H - y0) * 1.6, lean = 6 * s + R() * 4;
    c.strokeStyle = R() < .6 ? mix(col, '#2f4a2a', .25 + R() * .2) : mix(col, '#f4f0c8', .3); c.lineWidth = 2 * s; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + lean * .3, y - 9 * s, x + lean, y - 16 * s); c.stroke();
  }
  for (let i = 0; i < 60; i++){ const y = y0 + 40 + R() * (H - y0 - 40), x = R() * W, s = .5 + (y - y0) / (H - y0); circle(c, x, y - 6 * s, 3.5 * s); fill(c, ['#fff6d8', '#ffd2e0', '#d8e6ff'][i % 3]); }
}
/* a cel-shaded tree: canopy in clumps, lit left, one shadow tone right */
function tree(c, x, y, r, col = '#6f9a5e', d = 0){
  const lit = mix(mix(col, '#f6ebb0', .28), SKY_LOW, d * .7), base = mix(col, SKY_LOW, d * .7), shade = mix(mix(col, '#2c3f3a', .35), SKY_LOW, d * .7);
  oval(c, x + r * .7, y + r * .12, r * 1.2, r * .3); fill(c, 'rgba(40,60,50,.22)');
  c.fillStyle = mix(mix('#7a6550', SKY_LOW, d * .7), '#000000', .05); c.fillRect(x - r * .09, y - r * 1.1, r * .18, r * 1.1);
  const clumps = [[0, -1.6, 1], [-.55, -1.3, .7], [.55, -1.25, .72], [0, -2.15, .62]];
  for (const [dx, dy, k] of clumps){ circle(c, x + dx * r, y + dy * r, r * k * .75); fill(c, base); }
  for (const [dx, dy, k] of clumps){ c.save(); circle(c, x + dx * r, y + dy * r, r * k * .75); c.clip(); circle(c, x + dx * r - r * k * .25, y + dy * r - r * k * .22, r * k * .62); fill(c, lit); circle(c, x + dx * r + r * k * .55, y + dy * r + r * k * .35, r * k * .6); fill(c, shade); c.restore(); }
}
/* wind: drifting petals and leaves */
function drift(c, n, cols){ for (let i = 0; i < n; i++){ c.save(); c.translate(R() * W, R() * H * .8); c.rotate(-.6 + R() * .5); oval(c, 0, 0, 7, 3.5); fill(c, cols[i % cols.length]); c.restore(); } }
/* a faint paper grain over everything */
function grain(c){
  const t = document.createElement('canvas'); t.width = t.height = 256; const g = t.getContext('2d'); let s = 3; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 9000; i++){ g.fillStyle = r() < .5 ? 'rgba(255,255,255,.05)' : 'rgba(60,40,20,.035)'; g.fillRect(r() * 256, r() * 256, 1.4, 1.4); }
  c.fillStyle = c.createPattern(t, 'repeat'); c.fillRect(0, 0, W, H);
}
/* the kids: full colour, cel-shaded (one shadow tone on their right), a
   soft rim of sunlight on their left */
function kids(c, draw, centres, h){
  setStyle({ outline: null, shade: 'flat', feature: '#2d2a26' });
  const o = layer(), oc = o.getContext('2d'); draw(oc);
  /* the shadow side: a hard-edged tone, clipped to the kids */
  oc.save(); oc.globalCompositeOperation = 'source-atop'; oc.fillStyle = 'rgba(52,40,96,.2)';
  for (const x of centres){ oc.beginPath(); oc.moveTo(x + h * .11, 0); oc.lineTo(x + h * .7, 0); oc.lineTo(x + h * .7, H); oc.lineTo(x + h * .14, H); oc.closePath(); oc.fill(); }
  oc.restore();
  /* the rim: the kids' shape in warm light, peeking out on the sun side */
  const rim = layer(), rc = rim.getContext('2d'); rc.drawImage(o, 0, 0); rc.globalCompositeOperation = 'source-in'; rc.fillStyle = 'rgba(255,240,200,.95)'; rc.fillRect(0, 0, W, H);
  c.drawImage(rim, -4, -3);
  c.drawImage(o, 0, 0);
}
function card(c, x, y, who, text){
  c.save(); c.font = '600 28px Inter, Segoe UI, sans-serif'; const w = c.measureText(text).width + 130;
  c.shadowColor = 'rgba(40,40,60,.12)'; c.shadowBlur = 20; c.shadowOffsetY = 6;
  c.beginPath(); c.roundRect(x, y, w, 84, 42); fill(c, 'rgba(250,247,238,.94)'); c.shadowColor = 'transparent';
  circle(c, x + 42, y + 42, 28); fill(c, '#9db7c2'); circle(c, x + 42, y + 36, 11); fill(c, '#f6f3ec'); c.beginPath(); c.arc(x + 42, y + 64, 18, PI, 0); fill(c, '#f6f3ec');
  c.fillStyle = '#8a8478'; c.font = '600 18px Inter, Segoe UI, sans-serif'; c.fillText(who.toUpperCase(), x + 84, y + 34);
  c.fillStyle = INK; c.font = '600 28px Inter, Segoe UI, sans-serif'; c.fillText(text, x + 84, y + 66); c.restore();
}
function label(c, text){ c.save(); c.font = '600 24px Inter, sans-serif'; const w = c.measureText(text).width + 40; c.beginPath(); c.roundRect(28, H - 72, w, 46, 23); fill(c, 'rgba(51,50,46,.75)'); c.fillStyle = '#fff'; c.fillText(text, 48, H - 41); c.restore(); }
function smoke(c, x, y){ c.save(); c.filter = 'blur(3px)'; for (let i = 0; i < 7; i++){ circle(c, x + i * i * 4, y - i * 46, 16 + i * 6); fill(c, `rgba(214,208,198,${.85 - i * .09})`); } c.restore(); }
function ship(c, x, y, s, rot){
  c.save(); c.translate(x, y); c.rotate(rot); c.scale(s, s);
  c.beginPath(); c.roundRect(-250, -75, 470, 150, 75); fill(c, '#f4efe4');
  c.save(); c.clip(); c.fillStyle = '#d9d0c0'; c.fillRect(-260, 18, 500, 70); c.restore();
  c.fillStyle = '#d98a5b'; c.fillRect(-140, -75, 40, 150); c.fillStyle = '#b86f45'; c.fillRect(-140, 18, 40, 57);
  circle(c, 40, -5, 28); fill(c, '#8fb3c4'); circle(c, 32, -13, 8); fill(c, 'rgba(255,255,255,.7)');
  c.restore();
}
/* the far landmark: something enormous, asleep in the haze */
function giant(c, x, y, s){
  const col = mix('#7d8a8f', SKY_LOW, .62);
  c.beginPath(); c.ellipse(x, y, 260 * s, 120 * s, 0, PI, 0); fill(c, col);
  circle(c, x - 230 * s, y - 40 * s, 70 * s); fill(c, col);
  for (const k of [-.5, -.1, .3]){ poly(c, [[x + k * 300 * s - 22 * s, y - 100 * s], [x + k * 300 * s, y - 150 * s], [x + k * 300 * s + 22 * s, y - 104 * s]]); fill(c, col); }
}

/* LKP: running the trail, from behind */
function run(c){
  sky(c, 430); giant(c, 1180, 400, .9);
  range(c, 400, 90, '#7d9a8a', 1, 300, 1); range(c, 440, 70, '#6f9670', .7, 220, 3); range(c, 480, 40, '#7aa868', .35, 180, 5);
  ground(c, 470, '#8fbf6a');
  /* the path: worn earth, lit and shaded, narrowing into the haze */
  const pg = c.createLinearGradient(0, 470, 0, H); pg.addColorStop(0, mix('#d8c49e', SKY_LOW, .4)); pg.addColorStop(1, '#d8c49e');
  poly(c, [[760, 470], [840, 470], [1250, H], [350, H]]); fill(c, pg);
  poly(c, [[840, 470], [1250, H], [1120, H], [826, 470]]); fill(c, 'rgba(120,90,60,.12)');
  for (const [x, y, s] of [[790, 520, .7], [830, 590, .95], [760, 690, 1.3]]){ oval(c, x, y, 40 * s, 22 * s); fill(c, 'rgba(120,90,60,.22)'); for (const k of [-1, 0, 1]){ oval(c, x + k * 26 * s, y - 30 * s, 9 * s, 7 * s); fill(c, 'rgba(120,90,60,.22)'); } }
  ship(c, 230, 500, .45, -.12); smoke(c, 160, 470);
  tree(c, 470, 520, 34, '#6f9a5e', .4); tree(c, 1330, 540, 46, '#6f9a5e', .3);
  tree(c, 120, 680, 80); tree(c, 1480, 700, 96);
  drift(c, 40, ['#fff6d8', '#ffd2e0', '#cfe6b8']);
  kids(c, (o) => KIDS.forEach((k, i) => body(o, [620, 800, 980][i], 880, 270, k, T + i, i === 1 ? 'cheer' : 'stand', { costume: 'space', back: true })), [620, 800, 980], 270);
  grain(c);
  card(c, 40, 40, 'Nova', 'Follow the footprints!');
  label(c, 'Painted house style · LKP running');
}
/* LKP: the crash site */
function crash(c){
  sky(c, 460); giant(c, 1250, 440, .7);
  range(c, 430, 80, '#7d9a8a', 1, 280, 2); range(c, 470, 60, '#6f9670', .65, 210, 4);
  ground(c, 480, '#8fbf6a');
  tree(c, 140, 640, 76); tree(c, 1360, 560, 50, '#6f9a5e', .3); tree(c, 1490, 690, 90);
  oval(c, 1110, 705, 300, 30); fill(c, 'rgba(40,60,50,.22)');
  ship(c, 1060, 610, 1, -.12); smoke(c, 800, 560);
  /* a bird on the ship, and a critter peeking out of the long grass */
  c.fillStyle = INK; oval(c, 1170, 520, 22, 16); c.fill(); circle(c, 1186, 508, 11); c.fill(); poly(c, [[1195, 506], [1208, 510], [1195, 513]]); fill(c, '#d98a5b');
  oval(c, 560, 488, 34, 28); fill(c, '#7b6f8f'); for (const d of [-1, 1]){ circle(c, 560 + d * 12 + 4, 482, 8); fill(c, '#f6f3ec'); circle(c, 560 + d * 12 + 7, 482, 4); fill(c, INK); poly(c, [[560 + d * 14, 464], [560 + d * 26, 444], [560 + d * 30, 468]]); fill(c, '#7b6f8f'); }
  drift(c, 36, ['#fff6d8', '#ffd2e0', '#cfe6b8']);
  kids(c, (o) => KIDS.forEach((k, i) => body(o, [300, 470, 640][i], 770, 250, k, T + i, ['wave', 'stand', 'cheer'][i], { costume: 'space' })), [300, 470, 640], 250);
  grain(c);
  card(c, 40, 40, 'Nova', 'Is everyone OK? Wave if you’re OK!');
  label(c, 'Painted house style · LKP crash site');
}
/* Pop Party: a meadow in the late afternoon */
function pop(c){
  sky(c, 620);
  range(c, 590, 70, '#7d9a8a', 1, 320, 1); range(c, 630, 50, '#6f9670', .6, 240, 2);
  ground(c, 640, '#8fbf6a');
  tree(c, 120, 760, 90); tree(c, 1500, 780, 100);
  /* balloons: cel-shaded, a shine, strings bending in the wind */
  const bal = (x, y, r, col) => {
    c.strokeStyle = 'rgba(90,85,75,.7)'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, y + r * 1.15); c.quadraticCurveTo(x + 22, y + r * 2.2, x + 4, y + r * 3.2); c.stroke();
    oval(c, x, y, r, r * 1.15); fill(c, col);
    c.save(); oval(c, x, y, r, r * 1.15); c.clip(); oval(c, x + r * .55, y + r * .35, r * .8, r * 1.1); fill(c, mix(col, '#3a3060', .2)); c.restore();
    oval(c, x - r * .38, y - r * .45, r * .16, r * .26, -.5); fill(c, 'rgba(255,255,255,.75)');
    poly(c, [[x - 7, y + r * 1.22], [x + 7, y + r * 1.22], [x, y + r * 1.1]]); fill(c, col);
  };
  bal(600, 230, 48, '#e8b85a'); bal(1040, 190, 54, '#79b3aa'); bal(1270, 330, 42, '#de8a8a'); bal(300, 300, 40, '#b7a6d6');
  for (let i = 0; i < 12; i++){ const a = i / 12 * PI * 2, d = 50 + R() * 26; c.save(); c.translate(560 + Math.cos(a) * d, 360 + Math.sin(a) * d); c.rotate(a); c.fillStyle = KIDS[0].color; c.fillRect(-10, -4, 20, 8); c.restore(); }
  drift(c, 50, ['#fff6d8', '#ffd2e0', '#cfe6b8']);
  const xs = [440, 800, 1160], poses = ['cheer', 'reach', 'cheer'], u = 380 / 300;
  kids(c, (o) => KIDS.forEach((k, i) => body(o, xs[i], 860, 380, k, T + i, poses[i])), xs, 380);
  const HANDS = { cheer: [[-92, -290], [92, -290]], reach: [[-66, -305], [66, -305]] };
  KIDS.forEach((k, i) => { for (const [hx, hy] of HANDS[poses[i]]){ circle(c, xs[i] + hx * u, 860 + hy * u, 26); c.lineWidth = 6; c.strokeStyle = 'rgba(255,248,230,.95)'; c.stroke(); } });
  grain(c);
  KIDS.forEach((k, i) => { const x = 560 + i * 170; c.save(); c.shadowColor = 'rgba(40,40,60,.12)'; c.shadowBlur = 16; c.shadowOffsetY = 4; c.beginPath(); c.roundRect(x, 30, 150, 64, 32); fill(c, 'rgba(250,247,238,.94)'); c.restore(); circle(c, x + 32, 62, 20); fill(c, k.color); c.fillStyle = INK; c.font = '700 32px Inter, sans-serif'; c.fillText(String([12, 9, 14][i]), x + 66, 74); });
  label(c, 'Painted house style · Pop Party');
}
run(ctx('run')); crash(ctx('crash')); pop(ctx('pop'));
document.body.dataset.ready = '1';
</script>
</body></html>
